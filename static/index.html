<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsticker - Fakten, keine Spekulation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 2rem;
        }
        header {
            text-align: center;
            margin-bottom: 2rem;
            border-bottom: 1px solid #222;
            padding-bottom: 1rem;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 0.1em;
            color: #fff;
        }
        .subtitle {
            font-size: 0.85rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .meta {
            font-size: 0.75rem;
            color: #555;
            margin-top: 0.5rem;
        }
        #news-container {
            max-width: 700px;
            margin: 0 auto;
        }
        .news-item {
            border-left: 3px solid #2a6;
            padding: 1rem 1.5rem;
            margin-bottom: 1.5rem;
            background: #111;
            border-radius: 0 4px 4px 0;
            transition: border-color 0.2s;
            opacity: 0;
            animation: fadeIn 0.4s ease forwards;
        }
        .news-item:hover { border-color: #4c8; }
        .news-item h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #fff;
        }
        .news-item p {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #bbb;
        }
        .news-item .source {
            font-size: 0.75rem;
            color: #666;
            margin-top: 0.5rem;
        }
        .news-item .source a {
            color: #4a9;
            text-decoration: none;
        }
        .news-item .source a:hover { text-decoration: underline; }
        .loading, .end-message {
            text-align: center;
            color: #555;
            padding: 2rem;
            font-size: 0.85rem;
        }
        .error {
            text-align: center;
            color: #a44;
            padding: 2rem;
        }
        #scroll-sentinel {
            height: 1px;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #333;
            border-top-color: #4a9;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 0.5rem;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeIn { to { opacity: 1; } }
    </style>
</head>
<body>
    <header>
        <h1>NEWSTICKER</h1>
        <p class="subtitle">Nur Fakten. Keine Spekulation. Keine Meinung.</p>
        <p class="meta" id="meta"></p>
    </header>
    <div id="news-container"></div>
    <div id="scroll-sentinel"></div>
    <div id="status" class="loading"><span class="spinner"></span>Nachrichten werden geladen...</div>

    <script>
        let currentPage = 0;
        let loading = false;
        let allLoaded = false;
        let waitingForData = false;

        const container = document.getElementById('news-container');
        const status = document.getElementById('status');
        const meta = document.getElementById('meta');

        async function loadPage() {
            if (loading || allLoaded) return;
            loading = true;
            status.style.display = 'block';

            try {
                const resp = await fetch(`/api/news?page=${currentPage}`);
                if (resp.status === 429) {
                    status.innerHTML = '<span class="error">Zu viele Anfragen. Bitte warte einen Moment.</span>';
                    loading = false;
                    return;
                }
                const data = await resp.json();

                // Backend is still loading initial data
                if (data.updating && (!data.news || data.news.length === 0)) {
                    status.innerHTML = '<span class="spinner"></span>Nachrichten werden im Hintergrund geladen...';
                    loading = false;
                    waitingForData = true;
                    setTimeout(loadPage, 3000);  // Retry in 3s
                    return;
                }

                waitingForData = false;

                if (!data.news || data.news.length === 0) {
                    if (currentPage === 0) {
                        status.innerHTML = 'Noch keine Nachrichten verfügbar.';
                    } else {
                        allLoaded = true;
                        status.innerHTML = 'Alle Nachrichten geladen.';
                    }
                    return;
                }

                data.news.forEach((item, i) => {
                    const article = document.createElement('article');
                    article.className = 'news-item';
                    article.style.animationDelay = `${i * 0.08}s`;
                    article.innerHTML = `
                        <h2>${esc(item.headline)}</h2>
                        <p>${esc(item.text)}</p>
                        <p class="source">${esc(item.source)} &mdash; <a href="${esc(item.link)}" target="_blank" rel="noopener">Quelle</a></p>
                    `;
                    container.appendChild(article);
                });

                if (data.last_update) {
                    const updateInfo = data.updating ? ' (aktualisiert...)' : '';
                    meta.textContent = `Letzte Aktualisierung: ${new Date(data.last_update).toLocaleTimeString('de-DE')}${updateInfo}`;
                }

                if (!data.has_more) {
                    allLoaded = true;
                    status.innerHTML = 'Alle Nachrichten geladen.';
                } else {
                    currentPage++;
                    status.innerHTML = '<span class="spinner"></span>';
                }
            } catch (e) {
                status.innerHTML = '<span class="error">Verbindungsfehler. Erneuter Versuch...</span>';
                setTimeout(() => { loading = false; loadPage(); }, 5000);
                return;
            } finally {
                loading = false;
            }
        }

        function esc(s) {
            if (!s) return '';
            const d = document.createElement('div');
            d.textContent = s;
            return d.innerHTML;
        }

        // Infinite scroll with IntersectionObserver
        const observer = new IntersectionObserver((entries) => {
            if (entries[0].isIntersecting && !loading && !allLoaded && !waitingForData) {
                loadPage();
            }
        }, { rootMargin: '200px' });

        observer.observe(document.getElementById('scroll-sentinel'));

        // Initial load
        loadPage();
    </script>
</body>
</html>
